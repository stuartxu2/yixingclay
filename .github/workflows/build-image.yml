# On-demand image build — bootstrap / manual rebuild helper.
#
# Builds ONE image (backend or web) on a native amd64 runner and pushes it to
# ACR. Used to seed images before the Container Apps exist, and any time you
# need to rebuild without a full deploy. The push-to-main pipeline is
# deploy.yml; this workflow never deploys.
#
# Trigger from the Actions tab, or:  gh workflow run build-image.yml -f image=backend

name: Build image

on:
  workflow_dispatch:
    inputs:
      image:
        description: Which image to build and push
        type: choice
        options: [backend, web]
        required: true

env:
  ACR: ${{ vars.ACR_NAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log Docker in to ACR
        run: az acr login --name "$ACR"

      - name: Build & push backend
        if: ${{ inputs.image == 'backend' }}
        run: |
          docker build -f apps/backend/Dockerfile \
            -t "$ACR.azurecr.io/poet-backend:latest" \
            ./apps/backend
          docker push "$ACR.azurecr.io/poet-backend:latest"

      # NEXT_PUBLIC_* are inlined at build time — they must be set as repo
      # variables before running this for the web image.
      - name: Build & push web
        if: ${{ inputs.image == 'web' }}
        run: |
          docker build -f apps/web/Dockerfile \
            -t "$ACR.azurecr.io/poet-web:latest" \
            --build-arg NEXT_PUBLIC_MEDUSA_BACKEND_URL='${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}' \
            --build-arg NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY='${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}' \
            --build-arg NEXT_PUBLIC_MEDUSA_REGION_ID='${{ vars.NEXT_PUBLIC_MEDUSA_REGION_ID }}' \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY='${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}' \
            .
          docker push "$ACR.azurecr.io/poet-web:latest"
