# Build → migrate → deploy pipeline for yixingclay.com (Azure).
#
# Trigger: push to main, or manual run.
# Flow:
#   build    – build both images in ACR (cloud build, no Docker on runner)
#   migrate  – run `medusa db:migrate` ON THE RUNNER HOST against the prod DB
#              (running it inside the container hangs — see apps/backend/Dockerfile)
#   deploy   – roll both Azure Container Apps to the new image tag
#
# Required GitHub configuration (Settings → Secrets and variables → Actions):
#   Secrets:
#     AZURE_CREDENTIALS  – service-principal JSON (see docs/azure-provisioning.md)
#     DATABASE_URL       – prod Postgres connection string (for the migrate step)
#   Variables:
#     ACR_NAME                          – registry name, e.g. poetacr
#     AZURE_RESOURCE_GROUP              – resource group, e.g. poet-rg
#     NEXT_PUBLIC_MEDUSA_BACKEND_URL    – https://api.yixingclay.com
#     NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
#     NEXT_PUBLIC_MEDUSA_REGION_ID
#     NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR: ${{ vars.ACR_NAME }}
  RG: ${{ vars.AZURE_RESOURCE_GROUP }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── build both images and push to ACR ─────────────────────────────────────
  # The runner builds with plain `docker build` (native linux/amd64 — no
  # emulation needed). ACR Tasks (`az acr build`) is NOT used: it is blocked
  # on Azure for Students subscriptions.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log Docker in to ACR
        run: az acr login --name "$ACR"

      - name: Build & push backend image
        run: |
          docker build \
            -f apps/backend/Dockerfile \
            -t "$ACR.azurecr.io/poet-backend:$IMAGE_TAG" \
            -t "$ACR.azurecr.io/poet-backend:latest" \
            ./apps/backend
          docker push "$ACR.azurecr.io/poet-backend:$IMAGE_TAG"
          docker push "$ACR.azurecr.io/poet-backend:latest"

      # NEXT_PUBLIC_* values are inlined into the client bundle at build time,
      # so they are passed as build args (see apps/web/Dockerfile). The web
      # build context is the monorepo root so workspace packages resolve.
      - name: Build & push web image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t "$ACR.azurecr.io/poet-web:$IMAGE_TAG" \
            -t "$ACR.azurecr.io/poet-web:latest" \
            --build-arg NEXT_PUBLIC_MEDUSA_BACKEND_URL='${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}' \
            --build-arg NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY='${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}' \
            --build-arg NEXT_PUBLIC_MEDUSA_REGION_ID='${{ vars.NEXT_PUBLIC_MEDUSA_REGION_ID }}' \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY='${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}' \
            .
          docker push "$ACR.azurecr.io/poet-web:$IMAGE_TAG"
          docker push "$ACR.azurecr.io/poet-web:latest"

  # ── run DB migrations on the runner host (NOT in a container) ──────────────
  migrate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Apply migrations
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx medusa db:migrate

  # ── roll the Container Apps to the freshly built tag ──────────────────────
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend
        run: |
          az containerapp update -n poet-backend -g "$RG" \
            --image "$ACR.azurecr.io/poet-backend:$IMAGE_TAG"

      - name: Deploy web
        run: |
          az containerapp update -n poet-web -g "$RG" \
            --image "$ACR.azurecr.io/poet-web:$IMAGE_TAG"
